name: CI/CD – Week3 (Frontend + Backend + DB)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-and-push:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.LIL_TOKEN }}

      # 3️⃣ Build backend (root Dockerfile)
      - name: Build & push backend image
        run: |
          docker build -t ghcr.io/lilianfadi3/week3:latest .
          docker push ghcr.io/lilianfadi3/week3:latest

      # 4️⃣ Build frontend (templates folder)
      - name: Build & push frontend image
        run: |
          docker build -t ghcr.io/lilianfadi3/week3-templates:latest ./templates
          docker push ghcr.io/lilianfadi3/week3-templates:latest

      # 5️⃣ Start stack
      - name: Deploy test stack
        run: |
         docker compose -f /Desktop/week3/docker-compose.yml up -d 
 
      # 6️⃣ Debug logs (VERY IMPORTANT)
      - name: Show logs
        run: docker compose logs

      # 7️⃣ Wait for backend
      - name: Backend health check
        run: |
          for i in {1..10}; do
            curl -f http://localhost:5000 && exit 0
            echo "Waiting for backend..."
            sleep 5
          done
          echo "Backend failed"
          docker compose logs backend
          exit 1

      # 8️⃣ Wait for frontend
      - name: Frontend health check
        run: |
          for i in {1..10}; do
            curl -f http://localhost:8080 && exit 0
            echo "Waiting for frontend..."
            sleep 5
          done
          echo "Frontend failed"
          docker compose logs frontend
          exit 1

      # 9️⃣ Cleanup
      - name: Tear down stack
        run: docker compose down --volumes
