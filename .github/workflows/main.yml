
name: CI/CD – Week3 (Frontend + Backend + DB)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        run: |
          docker build -t ghcr.io/lilianfadi3/week3:latest .
          docker push ghcr.io/lilianfadi3/week3:latest

      - name: Build & push frontend image
        run: |
          docker build -t ghcr.io/lilianfadi3/week3-templates:latest ./templates
          docker push ghcr.io/lilianfadi3/week3-templates:latest
