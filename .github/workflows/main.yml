name: CI/CD – Week3 (Frontend + Backend + DB)

on:
  push:
    branches: [main]


jobs:
  build-test-and-push:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.LIL_TOKEN }}

      # 3️⃣ Build backend (root Dockerfile)
      - name: Build & push backend image
        run: |
          docker build -t ghcr.io/lilianfadi3/week3:latest .
          docker push ghcr.io/lilianfadi3/week3:latest

      # 4️⃣ Build frontend (templates folder)
      - name: Build & push frontend image
        run: |
          docker build -t ghcr.io/lilianfadi3/week3-templates:latest ./templates
          docker push ghcr.io/lilianfadi3/week3-templates:latest

      
 

      

      

      # 9️⃣ Cleanup
      - name: Tear down stack
        run: docker compose down --volumes
